<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 · contact-form</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root {
    --bg: #0f0d0b; --bg-raised: #17140f; --ink: #ede6d8; --ink-dim: #8a8173;
    --ink-faint: #4a4338; --rule: #2a241c; --accent: #ff7a1a;
    --ok: #4ade80; --fail: #f87171;
    --serif: 'Fraunces', serif; --mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--mono);
    min-height: 100vh; padding: 40px 20px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  .num { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
  h1 { font-family: var(--serif); font-weight: 300; font-size: 56px; line-height: 1; letter-spacing: -0.02em; margin-bottom: 24px; }
  h1 em { font-style: italic; color: var(--accent); }
  .intro { font-size: 14px; color: var(--ink-dim); line-height: 1.7; margin-bottom: 32px; }

  form { background: var(--bg-raised); border: 1px solid var(--rule); border-radius: 4px; padding: 24px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; }
  input, textarea {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 3px;
    padding: 10px 12px; font-family: var(--mono); font-size: 13px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 120px; }

  button {
    width: 100%; background: var(--accent); color: var(--bg); border: none;
    padding: 12px; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500;
    border-radius: 3px; cursor: pointer; margin-top: 12px;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .message { padding: 12px 14px; border-radius: 3px; margin-top: 12px; font-size: 13px; line-height: 1.5; min-height: 1em; }
  .message.error { background: rgba(248,113,113,0.1); border-left: 2px solid var(--fail); color: var(--ink); }
  .message.success { background: rgba(74,222,128,0.1); border-left: 2px solid var(--ok); color: var(--ink); }
  .message:empty { display: none; }

  #turnstile-container { margin-top: 12px; }

  .back { margin-top: 40px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
  .back a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="num">§ 16 — pages functions</div>
  <h1>contact-<em>form</em></h1>
  <p class="intro">
    A real contact form: input validation, Turnstile CAPTCHA, and delivery via MailChannels.
    No third-party form service, no account needed beyond Cloudflare. The <code>/api/contact</code>
    Function verifies the Turnstile token server-side before sending.
  </p>

  <form id="form">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" maxlength="100" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" maxlength="200" required>
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" maxlength="4000" required></textarea>
    </div>

    <!-- Replace data-sitekey with your Turnstile site key -->
    <div id="turnstile-container"
         class="cf-turnstile"
         data-sitekey="YOUR_TURNSTILE_SITE_KEY"
         data-theme="dark"></div>

    <button type="submit" id="submit">Send →</button>
    <div class="message" id="msg"></div>
  </form>

  <div class="back"><a href="/">← back to index</a></div>
</div>

<script>
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'message'; msg.textContent = '';
    submit.disabled = true;

    const token = window.turnstile?.getResponse();
    if (!token) {
      msg.className = 'message error';
      msg.textContent = 'Please complete the CAPTCHA.';
      submit.disabled = false;
      return;
    }

    try {
      const res = await fetch('api/contact', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          name:    document.getElementById('name').value,
          email:   document.getElementById('email').value,
          message: document.getElementById('message').value,
          token,
        }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      msg.className = 'message success';
      msg.textContent = 'Thanks — message sent.';
      form.reset();
      window.turnstile?.reset();
    } catch (err) {
      msg.className = 'message error';
      msg.textContent = err.message;
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
